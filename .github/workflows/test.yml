name: Agentic Flow Quality Gate

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-flow-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentic-flow

jobs:
  governance:
    name: Governance and Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # packages/agentdb is a submodule; tests/issue-fixes.test.ts asserts
          # on its source, and it is empty without this.
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - run: npm ci --ignore-scripts
        # --ignore-scripts is deliberate supply-chain hardening, but
        # better-sqlite3 is a native addon and cannot load without its build
        # step. Rebuild just that one package rather than dropping the flag.
      - run: npm rebuild better-sqlite3
      - run: npx tsc -p config/tsconfig.json --skipLibCheck --noEmit
      - run: npm run test:governance

  compatibility:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # packages/agentdb is a submodule; tests/issue-fixes.test.ts asserts
          # on its source, and it is empty without this.
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - run: npm ci --ignore-scripts
        # --ignore-scripts is deliberate supply-chain hardening, but
        # better-sqlite3 is a native addon and cannot load without its build
        # step. Rebuild just that one package rather than dropping the flag.
      - run: npm rebuild better-sqlite3
        # backwards-compatibility.test.ts imports the built package from dist/,
        # so the build has to run before the suite.
      - run: npm run build
      - run: npm test

  package:
    name: Build and Package
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # packages/agentdb is a submodule; tests/issue-fixes.test.ts asserts
          # on its source, and it is empty without this.
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - run: npm ci --ignore-scripts
        # --ignore-scripts is deliberate supply-chain hardening, but
        # better-sqlite3 is a native addon and cannot load without its build
        # step. Rebuild just that one package rather than dropping the flag.
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - run: npm pack --dry-run

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [governance, compatibility, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require all release checks
        env:
          GOVERNANCE: ${{ needs.governance.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$GOVERNANCE" = success
          test "$COMPATIBILITY" = success
          test "$PACKAGE" = success
