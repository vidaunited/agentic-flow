name: Performance Benchmarks

on:
  push:
    branches: [main]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Two merges in quick succession left two 20-minute benchmark runs racing each
# other on the same ref, and nothing cancelled either. Matches the group shape
# already used by test.yml.
#
# cancel-in-progress is right for this workflow specifically: every run measures
# whatever main currently is, so a superseded run's numbers are not worth the
# runner time. The cost is that cancelling can drop a data point mid-flight,
# including one that performance-tracking was about to store.
concurrency:
  group: agentic-flow-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          # `npm run build` below is `cd agentic-flow && npm run build`, so the
          # inner workspace needs its OWN dependencies. Installing only the root
          # ones left @huggingface/transformers and @metaharness/router absent
          # and resolved ruvector to the root's older ^0.2.18 instead of the
          # pinned 0.2.40 — 18 type errors, and the build never once succeeded.
          cd agentic-flow && npm ci --ignore-scripts && npm rebuild better-sqlite3
          cd ../benchmarks && npm install

      - name: Build packages
        run: npm run build

      - name: Run Vector Search Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:vector-search

      - name: Run Agent Operations Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:agent-operations

      - name: Run Memory Operations Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:memory

      - name: Run Task Orchestration Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:task-orchestration

      - name: Run Attention Mechanism Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:attention

      - name: Run GNN Benchmarks
        run: |
          cd benchmarks
          npm run benchmark:gnn

      - name: Run Regression Analysis
        id: regression
        run: |
          cd benchmarks
          npm run benchmark:regression

      - name: Generate HTML Report
        run: |
          cd benchmarks
          npm run benchmark:report

      - name: Export results for trend tracking
        run: |
          cd benchmarks
          npm run benchmark:export

      - name: Snapshot benchmark baseline (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd benchmarks
          cp data/results-v2.0.json data/baseline-v2.0.json
          echo "Baseline snapshot written to benchmarks/data/baseline-v2.0.json"

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmarks/data/results-v2.0.json
            benchmarks/data/benchmark-action.json
            benchmarks/data/baseline-v2.0.json
            benchmarks/data/regression-report.json
            benchmarks/reports/benchmark-report.html
          retention-days: 90

      - name: Upload HTML Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmarks/reports/benchmark-report.html
          retention-days: 90

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read regression report
            const reportPath = path.join(process.cwd(), 'benchmarks/data/regression-report.json');
            if (!fs.existsSync(reportPath)) {
              console.log('No regression report found');
              return;
            }

            // saveBenchmarkResults() wraps the payload as { ...metadata,
            // results: [report] }, so the comparisons live one level down.
            // Reading report.comparisons directly yielded undefined and threw
            // on the for..of below.
            const raw = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const report = Array.isArray(raw.results) ? raw.results[0] : raw;

            if (!report || !Array.isArray(report.comparisons)) {
              console.log('Regression report has no comparisons; skipping comment');
              return;
            }

            // Create comment body
            let body = '## 📊 Performance Benchmark Results\n\n';
            body += `Generated: ${new Date(report.timestamp).toLocaleString()}\n\n`;
            body += '### Performance Comparison\n\n';
            body += '| Benchmark | v1.0.0 P50 | v2.0.0 P50 | Improvement | Status |\n';
            body += '|-----------|-----------|-----------|-------------|--------|\n';

            for (const comp of report.comparisons) {
              const improvement = comp.improvement.factor.toFixed(1) + 'x';
              const status = comp.improvement.achieved ? '✅' : '❌';
              body += `| ${comp.benchmark} | ${comp.baseline.p50.toFixed(2)}ms | ${comp.current.p50.toFixed(2)}ms | ${improvement} | ${status} |\n`;
            }

            body += '\n### Summary\n\n';
            const passed = report.comparisons.filter(c => c.improvement.achieved).length;
            const total = report.comparisons.length;
            body += `- ✅ Passed: ${passed}/${total} benchmarks\n`;

            if (passed < total) {
              body += '\n⚠️ Some benchmarks did not meet performance targets. Please review the detailed results.\n';
            } else {
              body += '\n🎉 All performance targets met!\n';
            }

            body += `\n[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  performance-tracking:
    name: Track Performance Trends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: benchmark
    if: github.ref == 'refs/heads/main'

    # auto-push below commits the trend history; without this the job has only
    # the default read token and cannot write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/data

      # github-action-benchmark stores its history on gh-pages and fails if the
      # branch is absent. The repository has no gh-pages branch today, so gate
      # the step rather than failing the job; create the branch to enable it.
      - name: Check for gh-pages branch
        id: ghpages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No gh-pages branch — skipping trend storage. Create it to enable performance tracking."
          fi

      - name: Store performance metrics
        if: steps.ghpages.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'customBiggerIsBetter'
          # The action requires a flat [{name, unit, value}] array;
          # results-v2.0.json is an object of BenchmarkResult records and was
          # never parseable by it.
          output-file-path: benchmarks/data/benchmark-action.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: true
