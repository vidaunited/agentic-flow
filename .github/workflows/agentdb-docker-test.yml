name: AgentDB Docker Tests

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths:
      - 'packages/agentdb/**'
      # The pull_request trigger gained this in #12; push never had it, so a
      # merge that changes only this workflow matched nothing and the workflow
      # did not run on main at all.
      - '.github/workflows/agentdb-docker-test.yml'
  pull_request:
    branches: [ main, develop ]
    # Deliberately NO paths filter. Measured 2026-09-08: a check that reports
    # SKIPPED satisfies a required status check, but a check that is ABSENT
    # leaves the PR pending forever. Path-filtering the trigger makes these
    # checks absent on most PRs, so they could never be made required. The
    # filtering moved into the `changes` job below, which is ~10s and lets
    # every job still report a verdict on every PR.
  workflow_dispatch:

env:
  WORKING_DIR: packages/agentdb

jobs:
  changes:
    name: Detect agentdb changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Does this change touch agentdb?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
                    --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(packages/agentdb/|\.github/workflows/agentdb-docker-test\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "agentdb touched: $(cat "$GITHUB_OUTPUT")"

  # =============================================================================
  # Job 1: Docker Build and Test
  # =============================================================================
  docker-test:
    name: Docker Build & Smoke Tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # back to its original: the vitest suite it used to build is no longer in this job

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build all stages with cache
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Build stages in dependency order with layer caching
          docker buildx build -f docker/Dockerfile.root --target base -t agentdb-base --load \
            --cache-from type=gha --cache-to type=gha,mode=max .

          docker buildx build -f docker/Dockerfile.root --target package-test -t agentdb-package --load \
            --cache-from type=gha .

          # cli-test and mcp-test are NOT built here. Both run
          #   node dist/cli/agentdb-cli.js ...
          # and the package has never produced that path: tsconfig sets
          # rootDir "." so everything under src/ emits to dist/src/, and
          # package.json's own bin agrees -- "agentdb": "dist/src/cli/agentdb-cli.js".
          # Verified against BOTH the original and the scoped tsconfig: dist/cli/
          # is absent either way, so this is not a side effect of narrowing the
          # typecheck. The stages fail with
          #   Error: Cannot find module '/app/dist/cli/agentdb-cli.js'
          # and cannot pass until the submodule's Dockerfile is corrected
          # upstream. Filed as ruvnet/agentdb#25 -- restore these two
          # targets when it lands. It went unnoticed because this workflow
          # never once got past the `test` stage to reach them.
          #
          # That issue also covers a bigger one we found while checking:
          # Dockerfile.root:177 gives the PRODUCTION image
          #   CMD ["node", "dist/cli/agentdb-cli.js", "--help"]
          # so its default command cannot start either, and its healthcheck
          # (`node -e "process.exit(0)"`) passes regardless.

          docker buildx build -f docker/Dockerfile.root --target production -t agentdb-production --load \
            --cache-from type=gha .

  # =============================================================================
  # Job 2: Docker Compose Test
  # =============================================================================
  docker-compose-test:
    name: Docker Compose Validation
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Run docker compose tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          COMPOSE=docker/docker-compose.yml

          # This step used to be:
          #   docker compose up --build agentdb-test || echo "... skipping"
          #   docker compose down || true
          # which reported success whatever happened -- a missing file, a
          # broken image, a failing test -- so the job was green without ever
          # having built anything. It also looked in the working directory,
          # while the compose file lives under docker/.
          if [ ! -f "$COMPOSE" ]; then
            echo "::error::$COMPOSE is missing"
            exit 1
          fi

          # The compose file belongs to the pinned agentdb submodule and
          # declares `context: .` with `dockerfile: Dockerfile`, both resolved
          # relative to its own directory. docker/ holds neither a plain
          # Dockerfile nor the sources the build COPYs, so the stack cannot be
          # built from this repo and the fix belongs upstream. Skip on that one
          # named, checked condition -- and fail on anything else.
          if [ ! -f docker/Dockerfile ]; then
            echo "::warning::$COMPOSE references docker/Dockerfile, which the pinned submodule does not provide - skipping the compose build (upstream issue, not a regression here)"
            exit 0
          fi

          docker compose -f "$COMPOSE" up --build --exit-code-from agentdb-test agentdb-test
          docker compose -f "$COMPOSE" down

  # =============================================================================
  # Job 3: Multi-Platform Build (Optional)
  # =============================================================================
  multi-platform:
    name: Multi-Platform Build
    runs-on: ubuntu-latest
    # 45 because this job's duration is dominated by BUILDX CACHE STATE, not by
    # the work, and a single sample does not show that.
    #
    #   warm cache  run 34256862187  6m07s  (completed)
    #   cold cache  run 34258929081  KILLED at 20m27s
    #
    # I set 20 from the 6m07s run alone, called it "3x headroom", and the very
    # next run died on it. The log says why: the amd64 side finished at
    # 17:46:14 and the QEMU-emulated arm64 leg
    #   #20 [linux/arm64 base 6/6] RUN npm install --include=optional ...
    # was still running 18m42s later when the wall hit. Slow, not stuck --
    # emulated npm install is simply expensive, and it only looks fast when the
    # gha cache is warm.
    #
    # 45 (the value this workflow originally shipped with) is >2x the killed
    # duration and leaves room for a cold cache. Do NOT re-tighten this from one
    # green run; a warm-cache measurement is not this job's duration.
    timeout-minutes: 45
    # Was push-to-main only, which made this the one job that could never be
    # run on demand -- so it had no measured duration and its timeout was a
    # guess. A dispatch can now exercise it deliberately.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build for multiple platforms
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          docker buildx build -f docker/Dockerfile.root \
            --platform linux/amd64,linux/arm64 \
            --target production \
            -t agentdb:latest \
            .

  # =============================================================================
  # Job 4: NPM Package Dry Run
  # =============================================================================
  npm-publish-test:
    name: NPM Publish Dry Run
    runs-on: ubuntu-latest
    needs: [docker-test]
    timeout-minutes: 15  # back to its original: no longer runs the suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --include=optional || npm ci

      - name: Scope typecheck to shipped source
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
            const before = cfg.include;
            cfg.include = ['src/**/*', 'simulation/**/*', 'simulation/scenarios/**/*'];
            fs.writeFileSync('tsconfig.json', JSON.stringify(cfg, null, 2));
            console.log('tsconfig include was:', JSON.stringify(before));
            console.log('tsconfig include now:', JSON.stringify(cfg.include));
          "

      - name: Build package
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Dry run publish
        working-directory: ${{ env.WORKING_DIR }}
        run: npm publish --dry-run

      - name: Pack package
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm pack
          tar -tzf agentdb-*.tgz | head -50

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ env.WORKING_DIR }}/agentdb-*.tgz
          retention-days: 30

  # =============================================================================
  # Job 5: Performance Benchmarks (Optional)
  # =============================================================================
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: [docker-test]
    timeout-minutes: 20  # back to its original
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --include=optional || npm ci

      - name: Scope typecheck to shipped source
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
            const before = cfg.include;
            cfg.include = ['src/**/*', 'simulation/**/*', 'simulation/scenarios/**/*'];
            fs.writeFileSync('tsconfig.json', JSON.stringify(cfg, null, 2));
            console.log('tsconfig include was:', JSON.stringify(before));
            console.log('tsconfig include now:', JSON.stringify(cfg.include));
          "

      - name: Build package
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      # Benchmarks are explicitly optional (see the job header), so a failure
      # here must not fail the workflow. It was expressed as
      #   npm run benchmark || echo "Benchmarks completed"
      # which printed a message asserting the opposite of what had happened and
      # left the step green, so a crashing benchmark was indistinguishable from
      # a passing one. continue-on-error keeps the job tolerant while still
      # surfacing the failure in the run.
      - name: Run benchmarks
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: ${{ env.WORKING_DIR }}/benchmarks/results/
          retention-days: 30
        if: always()
