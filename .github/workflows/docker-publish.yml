name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME_PREFIX: ruvnet/agentic-flow

jobs:
  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One failing leg cancelled the other three today, so a single broken
      # image hid the state of the rest. Report each independently.
      fail-fast: false
      matrix:
        include:
          - name: ""
            image: agentic-flow
            dockerfile: docker/Dockerfile.agentic-flow
            context: .
            platforms: linux/amd64,linux/arm64
          - name: "-agentdb"
            image: agentic-flow-agentdb
            dockerfile: docker/Dockerfile.agentdb
            context: .
            platforms: linux/amd64,linux/arm64
          - name: "-mcp"
            image: agentic-flow-mcp
            dockerfile: docker/Dockerfile.mcp-server
            context: .
            platforms: linux/amd64,linux/arm64
          - name: "-swarm"
            image: agentic-flow-swarm
            dockerfile: docker/Dockerfile.swarm
            context: .
            platforms: linux/amd64,linux/arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      publish: ${{ steps.creds.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This repository has no DOCKERHUB_* secrets, so docker/login-action
      # failed with "Username and password required" and fail-fast cancelled the
      # other three matrix legs. Decide up front whether publishing is possible
      # and degrade to a build-only run when it is not — that still proves all
      # four Dockerfiles build on both architectures, which is the part of this
      # workflow that does not need credentials.
      - name: Check for Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set - building images without publishing."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.creds.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/ruvnet/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' && steps.creds.outputs.available == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-push
    # Scans docker.io/ruvnet/<image>:latest. With no push of our own that would
    # be reporting on images this run did not build, so gate it on publishing.
    if: github.event_name != 'pull_request' && needs.build-and-push.outputs.publish == 'true'
    strategy:
      matrix:
        image:
          - agentic-flow
          - agentic-flow-agentdb
          - agentic-flow-mcp
          - agentic-flow-swarm

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/ruvnet/${{ matrix.image }}:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-and-push
    # Same reasoning as security-scan: it exercises the published images.
    if: github.event_name != 'pull_request' && needs.build-and-push.outputs.publish == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create test environment file
        run: |
          cat > docker/.env.test <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          RESEARCH_DEPTH=3
          RESEARCH_TIME_BUDGET=30
          ENABLE_REASONINGBANK=true
          REASONINGBANK_BACKEND=sqlite
          EOF

      - name: Pull Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/ruvnet/agentic-flow:latest
          docker pull ${{ env.REGISTRY }}/ruvnet/agentic-flow-agentdb:latest
          docker pull ${{ env.REGISTRY }}/ruvnet/agentic-flow-mcp:latest
          docker pull ${{ env.REGISTRY }}/ruvnet/agentic-flow-swarm:latest

      - name: Start services
        run: |
          cd docker
          docker-compose --env-file .env.test up -d
          sleep 30

      - name: Health check
        run: |
          curl -f http://localhost:3000/health || exit 1
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:9000/health || exit 1

      - name: Run integration tests
        run: |
          docker exec agentic-flow-app npm test || true

      - name: Collect logs
        if: failure()
        run: |
          cd docker
          docker-compose logs > integration-test-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-logs
          path: docker/integration-test-logs.txt

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker-compose down -v

  # =============================================================================
  # Update Docker Hub Description
  # =============================================================================
  update-description:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-push
    # Calls the Docker Hub API with the same credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-push.outputs.publish == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@dc67fad7001ef9e8e3c124cb7a64e16d0a63d864 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ruvnet/agentic-flow
          readme-filepath: ./docker/README.md
          short-description: "Production-ready AI agent orchestration platform with 66 specialized agents and 213 MCP tools"

  # =============================================================================
  # Notify on Success
  # =============================================================================
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-push, security-scan, integration-test]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Send success notification
        run: |
          echo "Docker images successfully built and published!"
          echo "Images available at: https://hub.docker.com/u/${{ env.IMAGE_NAME_PREFIX }}"
